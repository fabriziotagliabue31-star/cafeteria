<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lex Coffee — Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F2E9D8;
    --paper-light: #FBF6EC;
    --espresso: #2B1B12;
    --espresso-soft: #4A362A;
    --copper: #B8672E;
    --copper-dark: #93511F;
    --brass: #8A6D3E;
    --line: rgba(43,27,18,0.16);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background: var(--paper); color: var(--espresso);
    font-family: 'Work Sans', sans-serif;
  }
  h1,h2,.display{ font-family: 'Fraunces', serif; margin:0; letter-spacing:-0.01em; }
  .mono{ font-family:'Space Mono', monospace; }
  main{ max-width: 760px; margin: 0 auto; padding: 40px 20px 80px; }

  header{ margin-bottom: 30px; }
  header .eyebrow{ font-size: 13.5px; color: var(--brass); margin-bottom: 6px; }
  header h1{ font-size: 30px; }

  .state-msg{
    background: var(--paper-light); border: 1px solid var(--line);
    border-radius: 14px; padding: 40px 24px; text-align:center;
    color: var(--espresso-soft); font-size: 15px; margin-top: 20px;
  }

  .cards{ display:grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 30px; }
  .card{
    background: var(--paper-light); border: 1px solid var(--line);
    border-radius: 14px; padding: 20px;
  }
  .card .label{ font-size: 13px; color: var(--espresso-soft); }
  .card .value{ font-family:'Fraunces', serif; font-size: 30px; margin-top: 6px; }

  section{ margin-top: 34px; }
  section h2{ font-size: 19px; margin-bottom: 14px; }

  table{ width:100%; border-collapse: collapse; background: var(--paper-light); border-radius: 12px; overflow:hidden; border: 1px solid var(--line); }
  th,td{ text-align:left; padding: 11px 14px; font-size: 14px; border-bottom: 1px solid var(--line); }
  th{ font-weight:600; color: var(--espresso-soft); font-size: 12.5px; }
  tr:last-child td{ border-bottom:none; }
  td.num, th.num{ text-align:right; font-family:'Space Mono', monospace; }

  .rank{ display:flex; align-items:center; gap:10px; }
  .rank .bar-bg{ flex:1; height:6px; background: var(--line); border-radius: 4px; overflow:hidden; }
  .rank .bar{ height:100%; background: var(--copper); border-radius:4px; }

  .cat-heading{
    font-size: 12.5px; font-weight:600; color: var(--brass); text-transform: uppercase;
    letter-spacing: 0.03em; margin: 18px 0 8px;
  }
  .cat-heading:first-child{ margin-top: 0; }
  .price-row{
    display:flex; align-items:center; gap: 12px;
    background: var(--paper-light); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 8px;
  }
  .price-row .p-name{ flex:1; font-size: 14.5px; font-weight: 500; }
  .price-row .p-input-wrap{ display:flex; align-items:center; gap:8px; }
  .price-row .p-input-wrap span{ font-size: 14px; color: var(--espresso-soft); }
  .price-row input[type="number"]{
    width: 92px; font-family:'Space Mono', monospace; font-size: 14px;
    padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: #fff; color: var(--espresso);
  }
  .price-row button{
    background: var(--espresso); color: var(--paper-light); border:none;
    padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight:600; cursor:pointer;
    flex-shrink:0;
  }
  .price-row button:disabled{ opacity: 0.5; cursor: default; }
  .price-row .p-feedback{ font-size: 12px; min-width: 60px; text-align:right; flex-shrink:0; }
  .p-feedback.ok{ color: #3E6B4A; }
  .p-feedback.err{ color: var(--copper-dark); }
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">Lex Coffee</div>
    <h1>Panel de pedidos</h1>
  </header>

  <div id="content">
    <div class="state-msg">Cargando estadísticas…</div>
  </div>

  <section id="productsSection" style="display:none;">
    <h2>Editar precios</h2>
    <div id="productsContent"></div>
  </section>
</main>

<script>
function fmt(n){ return "$" + Math.round(n).toLocaleString("es-AR"); }

function monthLabel(monthStr){
  const [y, m] = monthStr.split("-");
  const date = new Date(Number(y), Number(m) - 1, 1);
  const label = date.toLocaleDateString("es-AR", { month: "long", year: "numeric" });
  return label.charAt(0).toUpperCase() + label.slice(1);
}

async function loadStats(){
  const params = new URLSearchParams(window.location.search);
  const key = params.get("key");
  const content = document.getElementById("content");

  if (!key){
    content.innerHTML = `<div class="state-msg">Falta la clave de acceso en el link.</div>`;
    return;
  }

  loadProducts(key);

  try {
    const res = await fetch(`/api/stats?key=${encodeURIComponent(key)}`);
    if (res.status === 403){
      content.innerHTML = `<div class="state-msg">Acceso denegado. Revisá que el link tenga la clave correcta.</div>`;
      return;
    }
    if (!res.ok){
      content.innerHTML = `<div class="state-msg">No se pudieron cargar los datos. Probá de nuevo en un momento.</div>`;
      return;
    }

    const data = await res.json();
    render(data);
  } catch (err){
    content.innerHTML = `<div class="state-msg">Error de conexión. Revisá tu internet e intentá de nuevo.</div>`;
  }
}

function render(data){
  const content = document.getElementById("content");

  if (data.totalOrders === 0){
    content.innerHTML = `<div class="state-msg">Todavía no hay pedidos registrados.</div>`;
    return;
  }

  const maxQty = Math.max(...data.topProducts.map(p => p.qty), 1);

  content.innerHTML = `
    <div class="cards">
      <div class="card">
        <div class="label">Pedidos hoy</div>
        <div class="value">${data.today.count}</div>
      </div>
      <div class="card">
        <div class="label">Total estimado hoy</div>
        <div class="value">${fmt(data.today.total)}</div>
      </div>
      <div class="card">
        <div class="label">Pedidos históricos</div>
        <div class="value">${data.totalOrders}</div>
      </div>
      <div class="card">
        <div class="label">Facturado histórico</div>
        <div class="value">${fmt(data.totalRevenue)}</div>
      </div>
    </div>

    <section>
      <h2>Evolución mensual</h2>
      <table>
        <thead><tr><th>Mes</th><th class="num">Pedidos</th><th class="num">Total</th></tr></thead>
        <tbody>
          ${data.months.map(m => `
            <tr>
              <td>${monthLabel(m.month)}</td>
              <td class="num">${m.count}</td>
              <td class="num">${fmt(m.total)}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </section>

    <section>
      <h2>Últimos días</h2>
      <table>
        <thead><tr><th>Día</th><th class="num">Pedidos</th><th class="num">Total</th></tr></thead>
        <tbody>
          ${data.days.slice(0, 30).map(d => `
            <tr>
              <td>${d.day}</td>
              <td class="num">${d.count}</td>
              <td class="num">${fmt(d.total)}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </section>

    <section>
      <h2>Productos más pedidos</h2>
      <table>
        <tbody>
          ${data.topProducts.map(p => `
            <tr>
              <td style="width:45%">${p.name}</td>
              <td colspan="2">
                <div class="rank">
                  <div class="bar-bg"><div class="bar" style="width:${(p.qty / maxQty) * 100}%"></div></div>
                  <span class="mono" style="font-size:13px">${p.qty}</span>
                </div>
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </section>
  `;
}

const CATEGORY_LABELS = {
  cafes: "Café & bebidas",
  desayunos: "Desayunos",
  pasteleria: "Pastelería",
  combos: "Combos"
};

async function loadProducts(key){
  const section = document.getElementById("productsSection");
  const container = document.getElementById("productsContent");

  try {
    const res = await fetch('/api/products');
    if (!res.ok) throw new Error('No se pudieron cargar los productos');
    const products = await res.json();

    section.style.display = "block";

    const byCategory = {};
    products.forEach(p => {
      if (!byCategory[p.category]) byCategory[p.category] = [];
      byCategory[p.category].push(p);
    });

    container.innerHTML = Object.keys(byCategory).map(cat => `
      <div class="cat-heading">${CATEGORY_LABELS[cat] || cat}</div>
      ${byCategory[cat].map(p => `
        <div class="price-row" id="row-${p.id}">
          <div class="p-name">${p.name}</div>
          <div class="p-input-wrap">
            <span>$</span>
            <input type="number" id="input-${p.id}" value="${p.price}" min="0" step="50">
          </div>
          <button onclick="savePrice('${p.id}', '${key}')">Guardar</button>
          <span class="p-feedback" id="feedback-${p.id}"></span>
        </div>
      `).join("")}
    `).join("");
  } catch (err){
    section.style.display = "block";
    container.innerHTML = `<div class="state-msg">No se pudieron cargar los productos.</div>`;
  }
}

async function savePrice(id, key){
  const input = document.getElementById(`input-${id}`);
  const feedback = document.getElementById(`feedback-${id}`);
  const button = document.querySelector(`#row-${id} button`);
  const price = Number(input.value);

  if (isNaN(price) || price < 0){
    feedback.textContent = "Precio inválido";
    feedback.className = "p-feedback err";
    return;
  }

  button.disabled = true;
  feedback.textContent = "Guardando…";
  feedback.className = "p-feedback";

  try {
    const res = await fetch(`/api/admin-products?key=${encodeURIComponent(key)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, price })
    });

    if (!res.ok){
      feedback.textContent = "Error al guardar";
      feedback.className = "p-feedback err";
    } else {
      feedback.textContent = "Guardado ✓";
      feedback.className = "p-feedback ok";
      setTimeout(() => { feedback.textContent = ""; }, 2500);
    }
  } catch (err){
    feedback.textContent = "Sin conexión";
    feedback.className = "p-feedback err";
  } finally {
    button.disabled = false;
  }
}

loadStats();
</script>
</body>
</html>
