<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lex Coffee — Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root{
    --paper: #F2E9D8;
    --paper-light: #FBF6EC;
    --espresso: #2B1B12;
    --espresso-soft: #4A362A;
    --copper: #B8672E;
    --copper-dark: #93511F;
    --brass: #8A6D3E;
    --line: rgba(43,27,18,0.16);
    --sidebar-w: 220px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background: var(--paper); color: var(--espresso);
    font-family: 'Work Sans', sans-serif;
  }
  h1,h2,.display{ font-family: 'Fraunces', serif; margin:0; letter-spacing:-0.01em; }
  .mono{ font-family:'Space Mono', monospace; }

  .shell{ display:flex; min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width: var(--sidebar-w); flex-shrink:0;
    background: var(--espresso); color: var(--paper-light);
    padding: 26px 16px; position: sticky; top:0; height: 100vh;
  }
  .sidebar .brand{
    font-family:'Fraunces', serif; font-size: 20px; font-weight:600;
    padding: 0 10px 22px; border-bottom: 1px solid rgba(255,255,255,0.14); margin-bottom: 18px;
  }
  .sidebar nav{ display:flex; flex-direction:column; gap: 4px; }
  .sidebar button{
    display:flex; align-items:center; gap:10px;
    background:none; border:none; color: #D8CBB4;
    font-family:'Work Sans', sans-serif; font-size: 14.5px; font-weight:500;
    text-align:left; padding: 11px 12px; border-radius: 10px; cursor:pointer;
  }
  .sidebar button .dot{
    width:6px; height:6px; border-radius:50%; background: transparent; flex-shrink:0;
  }
  .sidebar button:hover{ background: rgba(255,255,255,0.06); color: #fff; }
  .sidebar button.active{ background: var(--copper); color: #fff; }
  .sidebar button.active .dot{ background: #fff; }

  /* ---------- Main content ---------- */
  .content{ flex:1; padding: 36px 30px 80px; max-width: 820px; }

  .page-title{ font-size: 26px; margin-bottom: 22px; }

  .state-msg{
    background: var(--paper-light); border: 1px solid var(--line);
    border-radius: 14px; padding: 40px 24px; text-align:center;
    color: var(--espresso-soft); font-size: 15px; margin-top: 20px;
  }

  .view{ display:none; }
  .view.active{ display:block; }

  .cards{ display:grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 30px; }
  .card{
    background: var(--paper-light); border: 1px solid var(--line);
    border-radius: 14px; padding: 20px;
  }
  .card .label{ font-size: 13px; color: var(--espresso-soft); }
  .card .value{ font-family:'Fraunces', serif; font-size: 30px; margin-top: 6px; }

  section{ margin-top: 34px; }
  section:first-child{ margin-top: 0; }
  section h2{ font-size: 19px; margin-bottom: 14px; }

  table{ width:100%; border-collapse: collapse; background: var(--paper-light); border-radius: 12px; overflow:hidden; border: 1px solid var(--line); }
  th,td{ text-align:left; padding: 11px 14px; font-size: 14px; border-bottom: 1px solid var(--line); }
  th{ font-weight:600; color: var(--espresso-soft); font-size: 12.5px; }
  tr:last-child td{ border-bottom:none; }
  td.num, th.num{ text-align:right; font-family:'Space Mono', monospace; }

  .rank{ display:flex; align-items:center; gap:10px; }
  .rank .bar-bg{ flex:1; height:6px; background: var(--line); border-radius: 4px; overflow:hidden; }
  .rank .bar{ height:100%; background: var(--copper); border-radius:4px; }

  .cat-heading{
    font-size: 12.5px; font-weight:600; color: var(--brass); text-transform: uppercase;
    letter-spacing: 0.03em; margin: 18px 0 8px;
  }
  .cat-heading:first-child{ margin-top: 0; }
  .price-row{
    display:flex; align-items:center; gap: 12px;
    background: var(--paper-light); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 8px;
  }
  .price-row .p-name{ flex:1; font-size: 14.5px; font-weight: 500; }
  .price-row .p-input-wrap{ display:flex; align-items:center; gap:8px; }
  .price-row .p-input-wrap span{ font-size: 14px; color: var(--espresso-soft); }
  .price-row input[type="number"]{
    width: 92px; font-family:'Space Mono', monospace; font-size: 14px;
    padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: #fff; color: var(--espresso);
  }
  .price-row button{
    background: var(--espresso); color: var(--paper-light); border:none;
    padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight:600; cursor:pointer;
    flex-shrink:0;
  }
  .price-row button:disabled{ opacity: 0.5; cursor: default; }
  .price-row .p-feedback{ font-size: 12px; min-width: 60px; text-align:right; flex-shrink:0; }
  .p-feedback.ok{ color: #3E6B4A; }
  .p-feedback.err{ color: var(--copper-dark); }

  .order-items{ font-size: 12.5px; color: var(--espresso-soft); }

  .chart-card{
    background: var(--paper-light); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px 18px 8px;
  }
  .chart-wrap{ position: relative; height: 220px; }

  @media (max-width: 720px){
    .shell{ flex-direction: column; }
    .sidebar{
      width: 100%; height:auto; position: static; padding: 16px;
    }
    .sidebar .brand{ padding-bottom: 12px; margin-bottom: 10px; }
    .sidebar nav{ flex-direction: row; overflow-x:auto; gap: 6px; }
    .sidebar button{ white-space:nowrap; }
    .content{ padding: 24px 16px 60px; }
    .cards{ grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">☕ Lex Coffee</div>
    <nav>
      <button class="nav-btn active" data-view="dashboard"><span class="dot"></span>Dashboard</button>
      <button class="nav-btn" data-view="precios"><span class="dot"></span>Precios</button>
      <button class="nav-btn" data-view="pedidos"><span class="dot"></span>Pedidos</button>
    </nav>
  </aside>

  <main class="content">
    <div id="view-dashboard" class="view active">
      <h1 class="page-title">Dashboard</h1>
      <div id="dashboardContent"><div class="state-msg">Cargando estadísticas…</div></div>
    </div>

    <div id="view-precios" class="view">
      <h1 class="page-title">Precios</h1>
      <div id="productsContent"><div class="state-msg">Cargando productos…</div></div>
    </div>

    <div id="view-pedidos" class="view">
      <h1 class="page-title">Pedidos</h1>
      <div id="ordersContent"><div class="state-msg">Cargando pedidos…</div></div>
    </div>
  </main>
</div>

<script>
function fmt(n){ return "$" + Math.round(n).toLocaleString("es-AR"); }

function monthLabel(monthStr){
  const [y, m] = monthStr.split("-");
  const date = new Date(Number(y), Number(m) - 1, 1);
  const label = date.toLocaleDateString("es-AR", { month: "long", year: "numeric" });
  return label.charAt(0).toUpperCase() + label.slice(1);
}

function dateTimeLabel(iso){
  const d = new Date(iso);
  return d.toLocaleString("es-AR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
}

// ---------- Navegación lateral ----------
document.querySelectorAll(".nav-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(`view-${btn.dataset.view}`).classList.add("active");
  });
});

// ---------- Dashboard ----------
async function loadStats(key){
  const container = document.getElementById("dashboardContent");
  try {
    const res = await fetch(`/api/stats?key=${encodeURIComponent(key)}`);
    if (res.status === 403){
      container.innerHTML = `<div class="state-msg">Acceso denegado. Revisá que el link tenga la clave correcta.</div>`;
      return;
    }
    if (!res.ok){
      container.innerHTML = `<div class="state-msg">No se pudieron cargar los datos. Probá de nuevo en un momento.</div>`;
      return;
    }
    const data = await res.json();
    renderDashboard(data);
    renderOrders(data.recentOrders || []);
  } catch (err){
    container.innerHTML = `<div class="state-msg">Error de conexión. Revisá tu internet e intentá de nuevo.</div>`;
  }
}

function renderDashboard(data){
  const container = document.getElementById("dashboardContent");

  if (data.totalOrders === 0){
    container.innerHTML = `<div class="state-msg">Todavía no hay pedidos registrados.</div>`;
    return;
  }

  const maxQty = Math.max(...data.topProducts.map(p => p.qty), 1);

  container.innerHTML = `
    <div class="cards">
      <div class="card">
        <div class="label">Pedidos hoy</div>
        <div class="value">${data.today.count}</div>
      </div>
      <div class="card">
        <div class="label">Total estimado hoy</div>
        <div class="value">${fmt(data.today.total)}</div>
      </div>
      <div class="card">
        <div class="label">Pedidos históricos</div>
        <div class="value">${data.totalOrders}</div>
      </div>
      <div class="card">
        <div class="label">Facturado histórico</div>
        <div class="value">${fmt(data.totalRevenue)}</div>
      </div>
    </div>

    <section>
      <h2>Ventas de los últimos 30 días</h2>
      <div class="chart-card"><div class="chart-wrap"><canvas id="salesChart"></canvas></div></div>
    </section>

    <section>
      <h2>Evolución mensual</h2>
      <div class="chart-card"><div class="chart-wrap"><canvas id="monthlyChart"></canvas></div></div>
    </section>

    <section>
      <h2>Últimos días</h2>
      <table>
        <thead><tr><th>Día</th><th class="num">Pedidos</th><th class="num">Total</th></tr></thead>
        <tbody>
          ${data.days.slice(0, 30).map(d => `
            <tr>
              <td>${d.day}</td>
              <td class="num">${d.count}</td>
              <td class="num">${fmt(d.total)}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </section>

    <section>
      <h2>Productos más pedidos</h2>
      <table>
        <tbody>
          ${data.topProducts.map(p => `
            <tr>
              <td style="width:45%">${p.name}</td>
              <td colspan="2">
                <div class="rank">
                  <div class="bar-bg"><div class="bar" style="width:${(p.qty / maxQty) * 100}%"></div></div>
                  <span class="mono" style="font-size:13px">${p.qty}</span>
                </div>
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </section>
  `;

  renderCharts(data);
}

let salesChartInstance = null;
let monthlyChartInstance = null;

function renderCharts(data){
  if (typeof Chart === "undefined"){
    ["salesChart", "monthlyChart"].forEach(id => {
      const canvas = document.getElementById(id);
      if (canvas) canvas.parentElement.innerHTML = `<div class="state-msg" style="padding:16px; font-size:13px;">No se pudo cargar la librería de gráficos. El resto del panel funciona igual.</div>`;
    });
    return;
  }

  try {
    Chart.defaults.font.family = "'Work Sans', sans-serif";
    Chart.defaults.color = "#4A362A";

    const last30 = data.days.slice(0, 30).slice().reverse();
    const salesCtx = document.getElementById("salesChart");
    if (salesChartInstance) salesChartInstance.destroy();
    salesChartInstance = new Chart(salesCtx, {
      type: "line",
      data: {
        labels: last30.map(d => d.day.slice(5)),
        datasets: [{
          label: "Ventas",
          data: last30.map(d => d.total),
          borderColor: "#B8672E",
          backgroundColor: "rgba(184,103,46,0.12)",
          fill: true,
          tension: 0.3,
          pointRadius: 2.5,
          pointBackgroundColor: "#B8672E"
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { ticks: { callback: v => fmt(v) }, grid: { color: "rgba(43,27,18,0.08)" } },
          x: { grid: { display: false } }
        }
      }
    });

    const monthlyCtx = document.getElementById("monthlyChart");
    const monthsAsc = data.months.slice().reverse();
    if (monthlyChartInstance) monthlyChartInstance.destroy();
    monthlyChartInstance = new Chart(monthlyCtx, {
      type: "bar",
      data: {
        labels: monthsAsc.map(m => monthLabel(m.month)),
        datasets: [{
          label: "Ventas",
          data: monthsAsc.map(m => m.total),
          backgroundColor: "#B8672E",
          borderRadius: 6,
          maxBarThickness: 46
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { ticks: { callback: v => fmt(v) }, grid: { color: "rgba(43,27,18,0.08)" } },
          x: { grid: { display: false } }
        }
      }
    });
  } catch (err){
    console.error("Error al renderizar gráficos:", err);
  }
}

// ---------- Pedidos (detalle) ----------
function renderOrders(orders){
  const container = document.getElementById("ordersContent");

  if (orders.length === 0){
    container.innerHTML = `<div class="state-msg">Todavía no hay pedidos registrados.</div>`;
    return;
  }

  container.innerHTML = `
    <table>
      <thead><tr><th>Fecha</th><th>Pedido</th><th class="num">Total</th></tr></thead>
      <tbody>
        ${orders.map(o => `
          <tr>
            <td style="white-space:nowrap">${dateTimeLabel(o.created_at)}</td>
            <td class="order-items">${(o.items || []).map(i => `${i.qty}× ${i.name}`).join(", ")}</td>
            <td class="num">${fmt(o.total)}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;
}

// ---------- Precios ----------
const CATEGORY_LABELS = {
  cafes: "Café & bebidas",
  desayunos: "Desayunos",
  pasteleria: "Pastelería",
  combos: "Combos"
};

async function loadProducts(key){
  const container = document.getElementById("productsContent");
  try {
    const res = await fetch('/api/products');
    if (!res.ok) throw new Error('No se pudieron cargar los productos');
    const products = await res.json();

    const byCategory = {};
    products.forEach(p => {
      if (!byCategory[p.category]) byCategory[p.category] = [];
      byCategory[p.category].push(p);
    });

    container.innerHTML = Object.keys(byCategory).map(cat => `
      <div class="cat-heading">${CATEGORY_LABELS[cat] || cat}</div>
      ${byCategory[cat].map(p => `
        <div class="price-row" id="row-${p.id}">
          <div class="p-name">${p.name}</div>
          <div class="p-input-wrap">
            <span>$</span>
            <input type="number" id="input-${p.id}" value="${p.price}" min="0" step="50">
          </div>
          <button onclick="savePrice('${p.id}', '${key}')">Guardar</button>
          <span class="p-feedback" id="feedback-${p.id}"></span>
        </div>
      `).join("")}
    `).join("");
  } catch (err){
    container.innerHTML = `<div class="state-msg">No se pudieron cargar los productos.</div>`;
  }
}

async function savePrice(id, key){
  const input = document.getElementById(`input-${id}`);
  const feedback = document.getElementById(`feedback-${id}`);
  const button = document.querySelector(`#row-${id} button`);
  const price = Number(input.value);

  if (isNaN(price) || price < 0){
    feedback.textContent = "Precio inválido";
    feedback.className = "p-feedback err";
    return;
  }

  button.disabled = true;
  feedback.textContent = "Guardando…";
  feedback.className = "p-feedback";

  try {
    const res = await fetch(`/api/admin-products?key=${encodeURIComponent(key)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, price })
    });

    if (!res.ok){
      feedback.textContent = "Error al guardar";
      feedback.className = "p-feedback err";
    } else {
      feedback.textContent = "Guardado ✓";
      feedback.className = "p-feedback ok";
      setTimeout(() => { feedback.textContent = ""; }, 2500);
    }
  } catch (err){
    feedback.textContent = "Sin conexión";
    feedback.className = "p-feedback err";
  } finally {
    button.disabled = false;
  }
}

// ---------- Init ----------
(function init(){
  const params = new URLSearchParams(window.location.search);
  const key = params.get("key");

  if (!key){
    document.querySelector(".content").innerHTML = `<div class="state-msg">Falta la clave de acceso en el link.</div>`;
    return;
  }

  loadStats(key);
  loadProducts(key);
})();
</script>
</body>
</html>
